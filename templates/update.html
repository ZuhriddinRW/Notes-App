{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="{% static 'output.css' %}">
	<link rel="shortcut icon" href="https://img.icons8.com/?size=100&id=59849&format=png&color=000000"
		type="image/x-icon">
	<title>Update Note</title>
</head>

<body class="bg-gray-900">
	<div class="w-full h-screen flex flex-col">
		<div class="w-full flex justify-start p-3">
			<a href="#" class="text-white text-4xl hover:opacity-70">Back</a>
		</div>
		<div class="w-full h-full flex justify-center items-center">
			<div class="bg-slate-900 flex items-center justify-center px-4">
				<div class="w-full max-w-lg bg-white rounded-2xl shadow-xl p-8">
					<h2 class="text-2xl font-semibold text-center text-gray-800 mb-6">
						Update Note
					</h2>
					<form class="space-y-5">
						<div>
							<label class="block text-sm font-medium text-gray-700 mb-1">
								Title
							</label>
							<input type="text" class="w-full px-4 py-2 border rounded-xl" />
						</div>
						<div>
							<label class="block text-sm font-medium text-gray-700 mb-1">
								Content
							</label>
							<textarea rows="6" class="w-full px-4 py-2 border rounded-xl resize-none"></textarea>
						</div>
						<div>
							<label class="block text-sm font-medium text-gray-700 mb-2">
								Note Color
							</label>
							<div class="flex flex-wrap gap-3">
								<button type="button"
									class="w-8 h-8 rounded-full bg-yellow-400 border-2 border-gray-300 hover:cursor-pointer"></button>
								<button type="button"
									class="w-8 h-8 rounded-full bg-green-400 border-2 border-gray-300 hover:cursor-pointer"></button>
								<button type="button"
									class="w-8 h-8 rounded-full bg-red-400 border-2 border-gray-300 hover:cursor-pointer"></button>
								<button type="button"
									class="w-8 h-8 rounded-full bg-purple-400 border-2 border-gray-300 hover:cursor-pointer"></button>
								<button type="button"
									class="w-8 h-8 rounded-full bg-blue-400 border-2 border-gray-300 hover:cursor-pointer"></button>
								<button type="button"
									class="w-8 h-8 rounded-full bg-orange-400 border-2 border-gray-300 hover:cursor-pointer"></button>
							</div>
						</div>
						<div class="flex justify-between items-center pt-4">
							<button type="submit"
								class="bg-blue-600 hover:bg-blue-700 hover:cursor-pointer text-white px-6 py-2 rounded-lg font-medium transition">
								Update
							</button>
							<button type="submit"
								class="bg-red-600 hover:bg-red-700 hover:cursor-pointer text-white px-6 py-2 rounded-lg font-medium transition">
								Delete
							</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
