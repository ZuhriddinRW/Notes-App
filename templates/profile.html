<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/static/output.css">
	<link rel="shortcut icon" href="https://img.icons8.com/?size=100&id=59849&format=png&color=000000"
		type="image/x-icon">
	<title>Profile</title>
</head>

<body class="bg-gray-900">
	<div class="w-full h-screen flex flex-col">
		<div class="w-full flex justify-start p-3">
			<a href="#" class="text-white text-4xl hover:opacity-70">Back</a>
		</div>
		<div class="w-full h-fit flex justify-center items-center">
			<div class="max-w-4xl mx-auto my-5 bg-white shadow-md rounded-lg p-6">
				<div class="flex flex-col sm:flex-row items-center sm:items-start gap-6 border-b pb-6">
					<div class="flex flex-col items-center">
						<img src="https://picsum.photos/160" class="w-40 h-40 rounded-lg object-cover border" />
						<button
							class="mt-3 flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded-md text-sm hover:bg-blue-700 hover:cursor-pointer transition">
							Change Photo
						</button>
					</div>
					<div class="text-center sm:text-left">
						<h2 class="text-2xl font-semibold text-gray-800">John Doe</h2>
						<p class="text-gray-500 text-sm">johndoe@mail.com</p>
					</div>
				</div>
				<form class="mt-6 space-y-6">
					<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
						<div>
							<label class="block text-sm font-medium text-gray-700 mb-1">
								First Name
							</label>
							<input type="text" placeholder="John"
								class="w-full border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
						</div>
						<div>
							<label class="block text-sm font-medium text-gray-700 mb-1">
								Last Name
							</label>
							<input type="text" placeholder="Doe"
								class="w-full border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
						</div>
					</div>
					<div>
						<label class="block text-sm font-medium text-gray-700 mb-1">
							Username
						</label>
						<input type="text" placeholder="johndoe"
							class="w-full border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
					</div>
					<div>
						<label class="block text-sm font-medium text-gray-700 mb-1">
							Email
						</label>
						<input type="email" placeholder="johndoe@mail.com"
							class="w-full border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
					</div>
					<div class="border-t pt-6">
						<h3 class="text-lg font-semibold text-gray-800 mb-4">
							Change Password
						</h3>
						<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
							<div>
								<label class="block text-sm font-medium text-gray-700 mb-1">
									Current Password
								</label>
								<input type="password"
									class="w-full border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
							</div>
							<div>
								<label class="block text-sm font-medium text-gray-700 mb-1">
									New Password
								</label>
								<input type="password"
									class="w-full border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
							</div>
							<div>
								<label class="block text-sm font-medium text-gray-700 mb-1">
									Confirm Password
								</label>
								<input type="password"
									class="w-full border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
							</div>
						</div>
					</div>
					<div class="flex justify-end pt-4">
						<button type="submit"
							class="bg-blue-600 text-white px-6 py-2 rounded-md font-medium hover:bg-blue-700 transition">
							Save Changes
						</button>
					</div>
				</form>
			</div>
		</div>
	</div>
</body>

</html>
