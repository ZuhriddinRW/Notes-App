{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="{% static 'output.css' %}"> -->
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" href="https://img.icons8.com/?size=100&id=59849&format=png&color=000000"
        type="image/x-icon">
    <title>Notes App</title>
</head>

<body class="bg-gray-900">
    <div class="flex flex-col">
        <div
            class="w-3/4 self-center z-10 rounded-2xl h-20 p-4 bg-slate-700/30 flex flex-row items-center lg:text-4xl md:text-3xl sm:text-2xl text-xs sticky top-5 backdrop-blur-lg">
            <a href="{% url 'notes' %}" class="me-4 text-white font-bold italic">Notes App</a>
            <a href="{% url 'archived' %}" class="me-auto text-white">Archive</a>
            <a href="{% url 'add' %}" class="text-white hover:opacity-70">Add</a>
            <a href="{% url 'profile' user.pk %}" class="mx-4 text-white hover:opacity-70">Profile</a>
            <a href="{% url 'logout' %}" class="text-white hover:opacity-70">Logout</a>
        </div>
        <div class="p-10 flex flex-row flex-wrap justify-start">
            {% for note in notes %}
            <a href="{% url 'update' note.pk %}" style="background-color: {{ note.color }};"
                class="hover:cursor-pointer select-none w-60 h-60 rounded-xl hover:scale-105 hover:rotate-2 {% if note.color == 'black' %}text-white{% endif %} transition-transform duration-300 transform p-3 my-2 mx-auto lg:mx-5 flex flex-col">
                <h2 class="text-2xl font-semibold text-center mb-2">{{ note.title }}</h2>
                <h4 class="text-2xs">{{ note.content }}</h4>
                <div class="mt-auto flex flex-row justify-between items-center">
                    <h4 class="text-sm">{{ note.created_at }}</h4>
                    <form method="post" action="{% url 'archive' note.pk %}">
                        {% csrf_token %}
                        <button class="cursor-pointer hover:scale-120 duration-200 hover:rotate-360">
                            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="grey" viewBox="0 0 24 24"
                                stroke-width="1.5" stroke="white" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="m20.25 7.5-.625 10.632a2.25 2.25 0 0 1-2.247 2.118H6.622a2.25 2.25 0 0 1-2.247-2.118L3.75 7.5m8.25 3v6.75m0 0-3-3m3 3 3-3M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125Z" />
                            </svg>
                        </button>
                    </form>
                </div>
            </a>
            {% empty %}
            <div class="w-full flex flex-col justify-center items-center mt-5 text-white">
                <h2 class="text-4xl text-white">You don't have any notes!</h2>
                <a href="{% url 'add' %}" class="text-2xl mt-2 text-blue-300 hover:text-blue-400">Add one!</a>
            </div>
            {% endfor %}
        </div>
    </div>
</body>

</html>
