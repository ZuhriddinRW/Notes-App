{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'output.css' %}">
    <link rel="shortcut icon" href="https://img.icons8.com/?size=100&id=59849&format=png&color=000000"
        type="image/x-icon">
    <title>Archived Notes</title>
</head>

<body class="bg-gray-900">
    <div class="flex flex-col">
        <div
            class="w-3/4 self-center z-10 rounded-2xl h-20 p-4 bg-slate-700/30 flex flex-row items-center lg:text-4xl md:text-3xl sm:text-2xl text-xs sticky top-5 backdrop-blur-lg">
            <a href="{% url 'notes' %}" class="me-4 text-white font-bold italic">Notes App</a>
            <a href="{% url 'archived' %}" class="me-auto text-white">Archive</a>
            <a href="{% url 'add' %}" class="text-white hover:opacity-70">Add</a>
            <a href="#" class="mx-4 text-white hover:opacity-70">Profile</a>
            <a href="{% url 'logout' %}" class="text-white hover:opacity-70">Logout</a>
        </div>
        <div class="p-10 flex flex-row flex-wrap justify-start">
            {% for note in notes %}
            <div
                class="hover:cursor-pointer select-none bg-gray-700 w-60 h-60 rounded-xl hover:scale-105 hover:rotate-2 transition-transform duration-300 transform p-3 my-2 mx-auto lg:mx-5 flex flex-col">
                <h2 class="text-2xl font-semibold text-center mb-2">{{ note.title }}</h2>
                <h4 class="text-lg">{{ note.content }}</h4>
                <div class="mt-auto flex flex-row justify-between items-center">
                    <h4 class="text-sm">{{ note.created_at }}</h4>
                    <form method="post" action="{% url 'delete' note.pk %}">
                        {% csrf_token %}
                        <button class="cursor-pointer hover:scale-120 duration-200 hover:rotate-360">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="grey" width="30" height="30" viewBox="0 0 24 24" stroke-width="1.5"
                                stroke="white" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                            </svg>

                        </button>
                    </form>
                </div>
            </div>
            {% empty %}
            <div class="w-full flex flex-col justify-center items-center mt-5 text-white">
                <h2 class="text-4xl text-white">It is empty!</h2>
            </div>
            {% endfor %}
        </div>
    </div>
</body>

</html>
