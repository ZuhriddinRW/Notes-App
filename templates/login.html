{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="{% static 'output.css' %}">
	 <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
	<link rel="shortcut icon" href="https://img.icons8.com/?size=100&id=59849&format=png&color=000000"
		type="image/x-icon">
	<title>Login</title>
</head>

<body class="bg-gray-900">
	<div class="w-full h-screen flex flex-col">
		<div class="w-full flex justify-start p-3">
			<a href="{% url 'welcome' %}" class="text-white text-4xl hover:opacity-70">Back</a>
		</div>
		<div class="w-full h-full flex justify-center items-center">
			<div class="flex flex-col items-center w-100 bg-white rounded-2xl m-5 p-5">
				<h1 class="text-3xl mb-2">Login</h1>
				<hr class="w-full my-2">

				{% if messages %}
				<div class="w-full mb-5">
					{% for message in messages %}
					{% if message.tags == 'error' %}
					<div
						class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded {% if message.tags %}bg-{{ message.tags }}-100 text-{{ message.tags }}-700 border-{{ message.tags }}-400{% endif %}">
						{{ message }}
					</div>
					{% endif %}
					{% endfor %}
				</div>
				{% endif %}

				<form method="post" class="w-full">
					{% csrf_token %}

					<div class="self-start w-full mb-5">
						<div class="flex flex-row justify-between items-center">
							<label for="username" class="text-2xs">Username</label>
							<input id="username" name="username" type="text" class="w-60 p-1 border rounded-xl">
						</div>
					</div>

					<div class="self-start w-full mb-5">
						<div class="flex flex-row justify-between items-center">
							<label for="password" class="text-2xs">Password</label>
							<input id="password" name="password" type="password" class="w-60 p-1 border rounded-xl">
						</div>
					</div>

					<div class="self-start w-full flex flex-row justify-center">
						<button type="submit"
							class="bg-blue-600 hover:bg-blue-700 hover:cursor-pointer p-3 mt-5 rounded-sm text-xl text-white">Sign
							In</button>
					</div>
				</form>

				<div class="self-start w-full flex flex-row justify-center mt-5">
					<p class="text-sm">Don't have an account? <a href="{% url 'register' %}"
							class="text-blue-600 hover:underline ml-1">Register</a></p>
				</div>

			</div>
		</div>
	</div>
</body>

</html>
